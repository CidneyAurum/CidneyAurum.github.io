name: Build and deploy Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-build.txt
            requirements-test.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install build and test dependencies
        run: python -m pip install -r requirements-build.txt -r requirements-test.txt
      - name: Install Chromium and system dependencies
        run: python -m playwright install --with-deps chromium
      - name: Run Node regression checks
        run: node --test tests/*.test.cjs tests/*.test.mjs
      - name: Run Python and browser regression checks
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build content and assets
        run: |
          python tools/optimize_assets.py
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" python tools/build.py
          python tools/version_pin.py "${GITHUB_SHA::12}"
          python tools/prepare_site.py
      - name: Upload public site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy built site
        id: deployment
        uses: actions/deploy-pages@v4
