name: build content

# 任何 push 都会：构建文章/照片墙数据 + 把全站资源版本号统一为 git 短 SHA（根治 CDN 缓存）。
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 Pillow（图片优化用）
        run: pip install pillow

      - name: 资产体积优化（纹理量化 / WebP / 缩略图，幂等）
        run: python tools/optimize_assets.py

      - name: 计算照片默认日期（取提交年月）
        run: echo "PHOTO_DATE=$(git log -1 --format=%cd --date=format:%Y-%m)" >> "$GITHUB_ENV"

      - name: 构建文章与照片墙
        run: python tools/build.py

      - name: 资源版本号统一为本次提交短 SHA
        run: python tools/version_pin.py "${GITHUB_SHA::7}"

      - name: 提交构建结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "没有需要提交的变更"
          else
            git commit -m "build: 自动更新文章数据 + 版本号指纹 [skip ci]"
            git push
          fi
